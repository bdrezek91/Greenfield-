services:
  node-exporter:
    profiles: ["monitoring"]
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    command:
      - --collector.disable-defaults
      - --collector.textfile
      - --collector.textfile.directory=/textfiles/health
    volumes:
      - ${DATA_DIR:-./data}:/textfiles:ro
    expose:
      - "9100"
    read_only: true
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  alert-receiver:
    profiles: ["monitoring"]
    build:
      context: .
      dockerfile: docker/Dockerfile.collector
    image: greenfield-phase1:collector
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      ALERT_FORWARD_URL: ${ALERT_FORWARD_URL:-}
      ALERT_FORWARD_BEARER_TOKEN: ${ALERT_FORWARD_BEARER_TOKEN:-}
    command:
      - python
      - scripts/run_alert_receiver.py
      - --journal-root
      - /app/reports/alerts
    volumes:
      - ai-trading-lab-reports:/app/reports
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  alertmanager:
    profiles: ["monitoring"]
    image: prom/alertmanager:v0.32.1
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - greenfield-alertmanager-data:/alertmanager
    ports:
      - "${MONITORING_BIND_ADDRESS:-127.0.0.1}:9093:9093"
    depends_on:
      - alert-receiver
    read_only: true
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.12.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - greenfield-prometheus-data:/prometheus
    ports:
      - "${MONITORING_BIND_ADDRESS:-127.0.0.1}:9090:9090"
    depends_on:
      - node-exporter
      - alertmanager
      - alert-receiver
    read_only: true
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:13.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - greenfield-grafana-data:/var/lib/grafana
    ports:
      - "${MONITORING_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    depends_on:
      - prometheus
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  greenfield-alertmanager-data:
  greenfield-prometheus-data:
  greenfield-grafana-data:
