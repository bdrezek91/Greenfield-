global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    system: greenfield-v2

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: greenfield-node
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093

  - job_name: greenfield-alert-receiver
    metrics_path: /metrics
    static_configs:
      - targets:
          - alert-receiver:8080
