[project]
name = "ai-trading-lab"
version = "0.1.0"
description = "Modular research platform for systematic trading strategy research (Bybit USDT Perpetual Futures)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
dependencies = [
    # NautilusTrader 1.231's Cython wranglers require writable NumPy
    # buffers; pandas 3 exposes read-only buffers for these columns.
    "pandas>=2.2,<3.0",
    "pyarrow>=16.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "typer>=0.12",
    "pyyaml>=6.0",
    "tzdata>=2024.1",
    "scipy>=1.13",
]

[project.optional-dependencies]
# Data layer (Phase 2): official Bybit API client + CCXT as a future
# multi-exchange abstraction layer.
data = [
    "pybit>=5.7",
    "ccxt>=4.3",
]
# Backtesting engine (Phase 3): NautilusTrader is the execution/backtest
# engine; VectorBT is added alongside the first strategy families (Phase 5+)
# for exploratory parameter sweeps.
backtest = [
    "nautilus_trader>=1.220",
]
# ML layer (Phase 11 framework, Phase 12 first baseline models).
ml = [
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "detect-secrets>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
