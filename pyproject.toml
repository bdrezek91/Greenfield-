[project]
name = "ai-trading-lab"
version = "0.1.0"
description = "Modular research platform for systematic trading strategy research (Bybit USDT Perpetual Futures)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "typer>=0.12",
]

[project.optional-dependencies]
# Added once the data layer is implemented (Phase 2).
data = [
    "pybit>=5.7",
    "ccxt>=4.3",
]
# Added once the backtesting engine is implemented (Phase 3).
backtest = [
    "nautilus_trader>=1.190",
    "vectorbt>=0.26",
]
# Added once the ML layer is implemented (Phase 11+).
ml = [
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "detect-secrets>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
