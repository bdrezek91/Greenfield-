      - "scripts/collect_raw_deribit.py"
      - "--instrument"
      - "ETH-PERPETUAL"
      - "--collector-id"
      - "eth-perpetual"

  # Legacy reduced microstructure collector. It remains available for
  # historical compatibility but is not started by a default compose-up.
  # Public market data only (order book/trade tape/liquidations) - no API
  # keys, no account access. Flushes its buffers on SIGTERM
  # (src/data/microstructure_collector.py) so `docker stop`/compose
  # shutdown never silently drops the current batch.
  # Start: docker compose up -d microstructure-collector
  microstructure-collector:
    profiles: ["legacy"]
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ai-trading-lab:dev
    restart: unless-stopped
    volumes:
      - .:/app
      - ai-trading-lab-data:/app/data
    command:
      - "python"
      - "scripts/collect_microstructure.py"
      - "--symbol"
      - "${MICROSTRUCTURE_SYMBOL:-BTCUSDT}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "find /app/data/microstructure -mmin -10 -name '*.parquet' | grep -q .",
        ]
      interval: 5m
      timeout: 10s
      start_period: 5m
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Public market data only (Bybit's long/short account-ratio endpoint) -
  # no API keys, no account access. Unlike funding/open-interest, this
  # endpoint has no backfill - see
  # src/data/long_short_ratio_client.py's module docstring - so, like
  # microstructure-collector above, history not collected live is gone
  # for good.
  # Start: docker compose up -d long-short-ratio-collector
  long-short-ratio-collector:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ai-trading-lab:dev
    restart: unless-stopped
    volumes:
      - .:/app
      - ai-trading-lab-data:/app/data
    command:
      - "python"
      - "scripts/collect_long_short_ratio.py"
      - "--symbol"
      - "${MICROSTRUCTURE_SYMBOL:-BTCUSDT}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "find /app/data/long_short_ratio -mmin -30 -name '*.parquet' | grep -q .",
        ]
      interval: 5m
      timeout: 10s
      start_period: 5m
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Binance USDT-M futures derivatives statistics pollers (Cycle 17).
  # Public market data only (openInterestHist / globalLongShortAccountRatio)
  # - no API keys, no account access. Disabled by default
  # (profiles: ["binance-derivatives"]) - new work requiring explicit
  # consent before VPS deployment, same reasoning as the raw-binance-*
