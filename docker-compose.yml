  raw-bybit-btc:
    <<: *raw-bybit-common
    environment:
      DATA_DIR: /app/data
      COLLECTOR_ID: btcusdt
      GREENFIELD_SOAK_ID: ${GREENFIELD_SOAK_ID:-}
      GREENFIELD_DEPLOY_COMMIT: ${GREENFIELD_DEPLOY_COMMIT:-}
