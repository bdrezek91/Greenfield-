          "CMD-SHELL",
          "find /app/data/binance_long_short_ratio -mmin -30 -name '*.parquet' | grep -q .",
        ]
      interval: 5m
      timeout: 10s
      start_period: 5m
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Daily, atomic compaction of microstructure batch files
  # (src/data/microstructure_compactor.py) - never deletes a source file
  # before its merged replacement is validated and already in place.
  # Start: docker compose up -d data-compactor
  data-compactor:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ai-trading-lab:dev
    restart: unless-stopped
    volumes:
      - .:/app
      - ai-trading-lab-data:/app/data
      - ai-trading-lab-reports:/app/reports
    command:
      - "python"
      - "scripts/compact_microstructure.py"
      - "--interval-hours"
      - "24"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  ai-trading-lab-data:
  ai-trading-lab-reports:
  # SHADOW's own data root (queue/work/audit/risk state + health) -
  # deliberately a distinct Docker-managed volume, never the same source as
  # raw-bybit-*'s ${DATA_DIR:-./data} host bind mount. See the
  # shadow-service comment above.
  shadow-service-data:
