services:
  # Interactive research/backtest workspace. Data-collector, execution and
  # monitoring services are added in later phases once they have real code
  # behind them (see docs/PHASE_0_ARCHITECTURE_RESEARCH.md, section 9).
  research:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ai-trading-lab:dev
    env_file:
      - path: .env
        required: false
    environment:
      TRADING_MODE: ${TRADING_MODE:-RESEARCH}
    volumes:
      - .:/app
      - ai-trading-lab-data:/app/data
    command: ["sleep", "infinity"]

  # One-shot test runner: `docker compose run --rm tests`
  tests:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ai-trading-lab:dev
    env_file:
      - path: .env
        required: false
    volumes:
      - .:/app
    command: ["pytest", "-q"]

  # Autonomous research factory (src/research/): runs one bounded, gated
  # research cycle per --interval-hours, in a SIGTERM-safe loop
  # (scripts/run_research_daemon.py). RESEARCH/BACKTEST only - never has
  # API credentials, never touches TradingMode.LIVE or PAPER order paths.
  # Start: docker compose up -d research-worker
  # Logs:  docker compose logs -f research-worker
  # Stop:  docker compose stop research-worker
  research-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ai-trading-lab:dev
    restart: unless-stopped
    environment:
      TRADING_MODE: RESEARCH
    volumes:
      - .:/app
      - ai-trading-lab-data:/app/data
      - ai-trading-lab-reports:/app/reports
    command:
      - "python"
      - "scripts/run_research_daemon.py"
      - "--interval-hours"
      - "24"
    healthcheck:
      # Fresh within the last 2x the cycle interval - a stuck/crashed loop
      # stops updating this file and Docker marks the container unhealthy
      # (restart_policy above then restarts it).
      test:
        [
          "CMD-SHELL",
          "find /app/reports/research/worker_heartbeat -mmin -2880 | grep -q .",
        ]
      interval: 10m
      timeout: 10s
      start_period: 5m
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Runs exactly one, explicitly-approved strategy on Bybit Demo (never
  # real capital - see src/execution/paper_node.py, which structurally
  # rejects anything but TradingMode.PAPER). The strategy/symbol/timeframe
  # must be set explicitly (via PAPER_STRATEGY/PAPER_SYMBOL/PAPER_TIMEFRAME
  # in .env) - this service never queries "the best strategy" itself; a
  # human sets it after promote_to_champion() in src/research/promotion.py.
  # Start: docker compose up -d paper-session
  # Logs:  docker compose logs -f paper-session
  # Stop:  docker compose stop paper-session
  paper-session:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ai-trading-lab:dev
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      TRADING_MODE: PAPER
    volumes:
      - .:/app
      - ai-trading-lab-data:/app/data
      - ai-trading-lab-reports:/app/reports
    # PAPER_SYMBOL/PAPER_STRATEGY have no default on purpose - see
    # .env.example. An empty value here is not a silent no-op: typer's
    # --symbol/--strategy are required options, so the container exits
    # immediately with a clear error instead of guessing a strategy.
    command:
      - "python"
      - "scripts/run_paper_session.py"
      - "--symbol"
      - "${PAPER_SYMBOL:-}"
      - "--timeframe"
      - "${PAPER_TIMEFRAME:-4h}"
      - "--strategy"
      - "${PAPER_STRATEGY:-}"
      - "--checkpoint-path"
      - "reports/paper_session/checkpoint.json"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "find /app/reports/paper_session/checkpoint.json -mmin -30 | grep -q .",
        ]
      interval: 5m
      timeout: 10s
      start_period: 5m
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # SHADOW service (Cycle 2): observes Meta Decisions from the durable
  # queue and maintains virtual portfolio state - no execution adapter is
  # ever imported in this path, so it can never submit a real order (see
  # src/execution/shadow_service.py). Disabled by default (profiles:
  # ["shadow"]) and isolated from the active Phase 1 Bybit soak: its data
  # root is the Docker-managed `shadow-service-data` named volume, not the
  # `${DATA_DIR:-./data}` host bind mount raw-bybit-* uses below - so there
  # is no shared mount source (verified by `docker compose config`; a
  # previous revision of this file claimed this isolation while both
  # services actually bound the identical host path - see
  # docs/CLAUDE_CODE_CONTINUATION.md Cycle 6 for that fix). Queue, work
  # store, audit journal, and risk state (all under /app/data inside this
  # container) therefore live on a filesystem raw-bybit-* never touches,
  # and container/restart boundaries were already independent.
  # SHADOW_SESSION_ID/SHADOW_DATASET_FINGERPRINT/SHADOW_CONFIG_FINGERPRINT
  # have no default on purpose - see .env.example.
  # Start: docker compose --profile shadow up -d shadow-service
  # Logs:  docker compose logs -f shadow-service
  # Stop:  docker compose stop shadow-service
  shadow-service:
    profiles: ["shadow"]
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ai-trading-lab:dev
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      TRADING_MODE: SHADOW
      DATA_DIR: /app/data
      GREENFIELD_DEPLOY_COMMIT: ${GREENFIELD_DEPLOY_COMMIT:-}
    volumes:
      - .:/app
      - shadow-service-data:/app/data
    command:
      - "python"
      - "scripts/run_shadow_service.py"
      - "--session-id"
      - "${SHADOW_SESSION_ID:-}"
      - "--dataset-fingerprint"
      - "${SHADOW_DATASET_FINGERPRINT:-}"
      - "--config-fingerprint"
      - "${SHADOW_CONFIG_FINGERPRINT:-}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "find /app/data/health -name 'shadow-service-*.json' -mmin -5 | grep -q .",
        ]
      interval: 1m
      timeout: 10s
      start_period: 2m
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Greenfield v2 Bronze collectors. Each symbol has an isolated connection,
