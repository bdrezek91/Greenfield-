# Kraken Futures (EEA-eligible perpetuals) symbol/timeframe universe.
#
# Symbols are Kraken's own raw contract codes (PF_ = Perpetual Fixed-margin,
# XBT = Kraken's ticker for Bitcoin) - used as-is throughout this codebase
# (storage paths, CLI --symbol, instrument IDs), the same "no translation
# layer" convention the Bybit version used. This list is a best-effort
# placeholder based on Kraken's commonly documented major listings, NOT a
# live sync from Kraken's instrument-info endpoint - this session's network
# egress policy blocks kraken.com (see docs/DATA.md). Verify the actual
# listed contracts (and that each one is available to EEA retail clients)
# on a machine with real network access before trusting this list.
symbols:
  - BTCUSD
  - ETHUSD
  - SOLUSD
  - XRPUSD
  - ADAUSD
  - LINKUSD
  - AVAXUSD
  - LTCUSD
  - BCHUSD
  - DOGEUSD

# Canonical timeframe label -> ccxt/Kraken OHLC timeframe code. Kraken's
# codes already match our canonical labels (unlike Bybit's numeric interval
# codes), so this is an identity mapping kept for interface consistency
# with src.data.config.SymbolUniverse.timeframes.
timeframes:
  "1m": 1m
  "5m": 5m
  "15m": 15m
  "1h": 1h
  "4h": 4h
  "1d": 1d
