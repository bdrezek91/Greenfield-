# Research protocol for the autonomous research factory (src/research/).
#
# This file is the single source of truth for how a research cycle picks
# hypotheses, splits data, and decides whether a candidate may be promoted
# to PAPER_CHALLENGER. It is versioned (bump `version` on any change that
# could alter a past decision's reproducibility - see
# docs/AUTONOMOUS_RESEARCH_AUDIT.md's reproducibility contract) and loaded
# by src/research/config.py. Nothing in src/research/ hardcodes a threshold
# that isn't defined here.
#
# None of these numbers are "magic guarantees" - a strategy that clears
# every gate is a candidate with OOS evidence, not a proven money-maker.
# See docs/RESEARCH_METHODOLOGY.md and docs/AUTONOMOUS_RESEARCH_AUDIT.md.

version: 1

universe:
  symbols: [BTCUSDT, ETHUSDT, SOLUSDT]
  # 4h/1d are where a fee/funding-aware edge is remotely plausible for
  # perpetual futures at this account size (see docs/PROJECT_STATUS.md's
  # 15m/1h walk-forward results - both uniformly negative after realistic
  # costs). 1h is kept as a secondary/confirmatory timeframe only, never
  # the sole basis for a promotion decision. 15m stays off by default -
  # re-enable explicitly and only after re-validating with the corrected
  # annualization and funding (see docs/AUTONOMOUS_RESEARCH_AUDIT.md M1/M2).
  timeframes_primary: [4h, 1d]
  timeframes_secondary: [1h]
  timeframes_disabled: [15m, 5m, 1m]

data_split:
  # Walk-forward window lengths fed to generate_windows().
  train_days: 90
  validation_days: 21
  test_days: 21
  # Bars dropped from the edge of TRAIN adjacent to VALIDATION/TEST to stop
  # a feature computed with a trailing window (e.g. a 20-bar lookback) from
  # leaking information across the split boundary.
  purge_bars: 20
  # Additional bars skipped entirely between TRAIN and VALIDATION/TEST
  # after purging, so a label's forward-looking horizon can't reach across
  # the boundary either (src/ml/splits.py's purged_kfold_split uses the
  # same concept for ML folds; this is the walk-forward equivalent).
  embargo_bars: 10
  # Caps how far back a walk-forward run looks, regardless of how much
  # history happens to be sitting on disk. Without this, the number of
  # walk-forward windows - and therefore the number of engine runs per
  # hypothesis - scales directly with whatever's been downloaded, which is
  # operationally unpredictable (found in practice: a symbol with years of
  # accumulated history from earlier research iterations produced 100+
  # windows instead of ~20, turning a ~1 minute hypothesis into 30+
  # minutes). 730 days (~2 years) is a deliberate choice, not just a
  # performance cap - very old regimes are of questionable relevance to a
  # strategy meant to trade current market conditions anyway. Set to null
  # to use all available history (no cap).
  max_lookback_days: 730

holdout:
  # Frozen final holdout: the most recent N days of the universe's
  # available history at the time this protocol version was cut. A given
  # (hypothesis_family, holdout_id) pair may be evaluated against the
  # holdout AT MOST ONCE - src/research/ledger.py enforces this as a hard
  # error, not a warning. Extending the holdout window requires bumping
  # `version` above (a new holdout_id), never quietly moving the dates.
  enabled: true
  holdout_id: "2026H1-v1"
  days: 60
  # Evaluated only for a candidate that has already cleared every other
  # promotion_gate check on non-holdout OOS data - never used to pick
  # among competing hypotheses.

hypothesis_budget:
  # Hard caps enforced by src/research/queue.py before a cycle runs
  # anything - never a soft suggestion. Keeps the research queue to
  # economically-motivated, bounded families (see brief section "ETAP 2")
  # instead of unbounded indicator/parameter mining.
  max_new_hypotheses_per_cycle: 5
  max_variants_per_hypothesis: 12
  max_cpu_minutes_per_cycle: 240
  max_wall_clock_minutes_per_cycle: 360

hypothesis_families:
  # A: time-series momentum/trend.
  - id: momentum_trend
    enabled: true
    description: >
      Time-series momentum/trend-following across a few lookback horizons,
      with volatility-scaled sizing, long/short evaluated separately, and
      a time-based or ATR-based exit. No unconstrained grid search - the
      parameter grid per hypothesis is capped by max_variants_per_hypothesis.
  # B: cross-asset/regime confirmation.
  - id: cross_asset_regime
    enabled: true
    description: >
      BTC used as a market-regime filter for ETH/SOL signals; requires
      momentum agreement across 4h/1d; regime (trend/sideways/high-vol)
      classified only from past data (src/regimes).
  # C: funding/OI.
  - id: funding_oi
    enabled: true
    description: >
      Extreme funding rate as a contrarian filter/signal; OI change
      combined with price direction; price x OI x funding interaction,
      evaluated separately for trend and mean-reversion variants.
  # D: portfolio.
  - id: portfolio_combination
    enabled: true
    description: >
      Combination of already-individually-positive, low-correlation
      strategies; volatility targeting; concentration limits; correlation
      computed only from past data (no look-ahead).
  # E: microstructure - explicitly disabled until enough history exists.
  - id: microstructure
    enabled: false
    description: >
      Disabled by design (see docs/PROJECT_STATUS.md: microstructure
      collection only started 2026-08-16 - not enough history yet). Do not
      enable without first validating latency/timestamp alignment, spread,
      and fill feasibility for any raw order-book-imbalance feature.

costs:
  # Three named scenarios. A hypothesis must clear `adverse`, not just
  # `base`, to be promotion-eligible; `severe` is a stress/breakpoint
  # check, not a pass/fail gate.
  base:
    fee_multiplier: 1.0
    slippage_multiplier: 1.0
    funding_multiplier: 1.0
    entry_delay_bars: 0
  adverse:
    fee_multiplier: 1.5
    slippage_multiplier: 2.0
    funding_multiplier: 1.5
    entry_delay_bars: 1
  severe:
    fee_multiplier: 2.0
    slippage_multiplier: 4.0
    funding_multiplier: 2.0
    entry_delay_bars: 2

promotion_gate:
  # A candidate needs ALL of these simultaneously - no single metric
  # (Sharpe, CAGR, or one great backtest) promotes anything on its own.
  min_oos_trades: 30
  min_independent_symbols_positive: 2
  aggregate_oos_return_positive_after_adverse_costs: true
  median_fold_return_positive: true
  min_fraction_positive_oos_folds: 0.60
  max_single_fold_share_of_total_return: 0.50
  max_single_trade_share_of_total_return: 0.20
  min_deflated_sharpe_ratio: 0.95
  max_probability_of_backtest_overfitting: 0.20
  require_parameter_stability: true # a broad plateau, never a single sharp optimum
  max_drawdown_pct: 0.30
  max_perturbation_degradation_pct: 0.30 # vs. +/-10-20% parameter perturbation
  entry_lag_one_bar_must_stay_non_negative: true
  requires_funding_applied: true
  requires_mark_to_market: true
  requires_complete_data: true # any data-quality failure blocks promotion, never defaults through

paper_promotion:
  # PAPER_CHALLENGER -> PAPER_CHAMPION (src/research/promotion.py). Always
  # requires a human sign-off - the worker may recommend, never activate.
  min_paper_weeks: 8
  max_paper_weeks_for_decision: 12
  min_paper_trades: 20
  max_signal_frequency_deviation_pct: 0.40 # vs. backtest-implied trade frequency
  max_fill_slippage_bps: 25
  min_fill_rate_pct: 0.90
  no_risk_limit_violations: true
  requires_human_approval: true

retirement:
  # DEGRADED -> RETIRED, or an immediate PAPER kill switch - see
  # src/research/promotion.py and docs/AUTONOMOUS_RESEARCH_AUDIT.md ETAP 5.
  max_paper_drawdown_pct: 0.25
  consecutive_degraded_reviews_before_retirement: 3
  auto_kill_on:
    - risk_limit_breach
    - heartbeat_loss
    - position_state_mismatch
    - order_error_storm
    - data_corruption
