schema_version: 1

# Greenfield v2 starts with exactly this research universe. Expansion is a
# separate reviewed decision; it must not be used to search for more backtests.
bybit:
  market_type: linear
  symbols:
    - BTCUSDT
    - ETHUSDT
    - SOLUSDT
  orderbook_depth: 50
  flush_interval_secs: 5.0
  max_batch_events: 10000
  queue_capacity: 100000
  ping_interval_secs: 20.0
  health_interval_secs: 5.0
  minimum_runtime_free_gib: 5.0
  reconnect_min_secs: 1.0
  reconnect_max_secs: 30.0

# OKX raw collector config (Cycle 7). Disabled-by-default in
# docker-compose.yml (profiles: ["okx"]) and requires its own soak marker
# (src/data/raw_collector_start_gate.py) authorizing these collector_ids
# before it can start - see scripts/collect_raw_okx.py. Not deployed to
# the VPS by this change.
okx:
  market_type: swap
  inst_ids:
    - BTC-USDT-SWAP
    - ETH-USDT-SWAP
    - SOL-USDT-SWAP
  flush_interval_secs: 5.0
  max_batch_events: 10000
  queue_capacity: 100000
  ping_interval_secs: 20.0
  health_interval_secs: 5.0
  minimum_runtime_free_gib: 5.0
  reconnect_min_secs: 1.0
  reconnect_max_secs: 30.0

# Coinbase raw collector config (Cycle 9). Disabled-by-default in
# docker-compose.yml (profiles: ["coinbase"]) and requires its own soak
# marker authorizing these collector_ids before it can start - see
# scripts/collect_raw_coinbase.py. Not deployed to the VPS by this change.
# ping_timeout_secs must stay below ping_interval_secs (enforced in
# src/data/raw_collector_config.py).
coinbase:
  market_type: spot
  product_ids:
    - BTC-USD
    - ETH-USD
    - SOL-USD
  flush_interval_secs: 5.0
  max_batch_events: 10000
  queue_capacity: 100000
  ping_interval_secs: 20.0
  ping_timeout_secs: 10.0
  health_interval_secs: 5.0
  minimum_runtime_free_gib: 5.0
  reconnect_min_secs: 1.0
  reconnect_max_secs: 30.0

# Binance USDT-M Futures raw collector config (Cycle 10). Disabled-by-default
# in docker-compose.yml (profiles: ["binance"]) and requires its own soak
# marker authorizing these collector_ids before it can start - see
# scripts/collect_raw_binance.py. Not deployed to the VPS by this change.
binance:
  market_type: linear
  symbols:
    - BTCUSDT
    - ETHUSDT
    - SOLUSDT
  flush_interval_secs: 5.0
  max_batch_events: 10000
  queue_capacity: 100000
  ping_interval_secs: 20.0
  ping_timeout_secs: 10.0
  health_interval_secs: 5.0
  minimum_runtime_free_gib: 5.0
  reconnect_min_secs: 1.0
  reconnect_max_secs: 30.0

# Deribit raw collector config (Cycle 11). Perpetuals only - BTC-PERPETUAL
# and ETH-PERPETUAL. SOL excluded: verified live that Deribit lists zero
# SOL futures/perpetual/option instruments (see
# src/data/deribit_raw_collector.py's module docstring). Dated futures and
# options are not yet included - they need a dynamic instrument-discovery
# mechanism this cycle does not add. Disabled-by-default in
# docker-compose.yml (profiles: ["deribit"]) and requires its own soak
# marker - see scripts/collect_raw_deribit.py. Not deployed to the VPS by
# this change.
deribit:
  market_type: future
  instruments:
    - BTC-PERPETUAL
    - ETH-PERPETUAL
  channel_interval: 100ms
  flush_interval_secs: 5.0
  max_batch_events: 10000
  queue_capacity: 100000
  heartbeat_interval_secs: 30
  health_interval_secs: 5.0
  minimum_runtime_free_gib: 5.0
  reconnect_min_secs: 1.0
  reconnect_max_secs: 30.0
