name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"

      - name: Install uv
        run: pip install uv==0.12.1

      - name: Sync locked dependencies
        run: uv sync --all-extras --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type-check (mypy)
        run: uv run mypy src scripts

      - name: Tests (pytest)
        run: uv run pytest -q --cov=src --cov-report=term-missing

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"

      - name: Install uv
        run: pip install uv==0.12.1

      - name: Sync locked dependencies
        run: uv sync --extra dev --locked

      - name: Scan for secrets
        run: git ls-files -z | xargs -0 uv run detect-secrets-hook --baseline .secrets.baseline

  monitoring-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate merged Compose model
        env:
          GRAFANA_ADMIN_PASSWORD: ci-placeholder-not-a-secret  # pragma: allowlist secret
        run: >-
          docker compose
          -f docker-compose.yml
          -f docker-compose.monitoring.yml
          --profile monitoring
          config --quiet

      - name: Validate Prometheus configuration and rules
        run: |
          docker run --rm \
            --entrypoint=/bin/promtool \
            -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.12.0 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm \
            --entrypoint=/bin/promtool \
            -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.12.0 \
            check rules /etc/prometheus/alerts.yml

      - name: Validate Alertmanager configuration
        run: >-
          docker run --rm
          --entrypoint=/bin/amtool
          -v "$PWD/monitoring/alertmanager:/etc/alertmanager:ro"
          prom/alertmanager:v0.32.1
          check-config /etc/alertmanager/alertmanager.yml

  docker-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build locked image
        run: >-
          docker build
          --build-arg GREENFIELD_GIT_COMMIT=${{ github.sha }}
          --file docker/Dockerfile
          --tag greenfield-ci:${{ github.sha }}
          .

      - name: Test image
        run: docker run --rm greenfield-ci:${{ github.sha }} pytest -q

      - name: Build minimal Phase 1 runtime image
        run: >-
          docker build
          --build-arg GREENFIELD_GIT_COMMIT=${{ github.sha }}
          --file docker/Dockerfile.collector
          --tag greenfield-phase1-ci:${{ github.sha }}
          .

      - name: Smoke-test Phase 1 runtime image
        run: >-
          docker run --rm greenfield-phase1-ci:${{ github.sha }}
          python -c
          "import pyarrow, structlog, typer, websocket;
          from src.data.bybit_raw_collector import RawBybitCollector;
          from src.monitoring.alert_receiver import AlertDeliveryProcessor"
