name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"

      - name: Install uv
        run: pip install uv==0.12.1

      - name: Sync locked dependencies
        run: uv sync --all-extras --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type-check (mypy)
        run: uv run mypy src

      - name: Tests (pytest)
        run: uv run pytest -q --cov=src --cov-report=term-missing

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"

      - name: Install uv
        run: pip install uv==0.12.1

      - name: Sync locked dependencies
        run: uv sync --extra dev --locked

      - name: Scan for secrets
        run: git ls-files -z | xargs -0 uv run detect-secrets-hook --baseline .secrets.baseline

  docker-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build locked image
        run: docker build --file docker/Dockerfile --tag greenfield-ci:${{ github.sha }} .

      - name: Test image
        run: docker run --rm greenfield-ci:${{ github.sha }} pytest -q
